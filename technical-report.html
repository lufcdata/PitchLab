<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PitchLab — Technical Report</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0d0e19;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head><body>
<iframe id="pitchlab-technical" src="base.html?v=metrics-139" title="PitchLab Technical Report"></iframe>
<script>
const frame=document.getElementById('pitchlab-technical');frame.addEventListener('load',()=>{const doc=frame.contentDocument;if(!doc)return;const V='metrics-139';
const css=(s,i)=>{const e=doc.createElement('link');e.rel='stylesheet';e.href=`${s}?v=${V}`;e.dataset[`trc${i}`]='1';doc.head.appendChild(e)};
const js=(s,i)=>new Promise((r,j)=>{const e=doc.createElement('script');e.src=`${s}?v=${V}`;e.async=false;e.onload=r;e.onerror=j;e.dataset[`trj${i}`]='1';doc.body.appendChild(e)});
['ui-integration.css','ui-team-colours.css','ui-polish.css','ui-v31-fixes.css','ui-technical-report.css'].forEach(css);
const scripts=['ui-team-colours.js','ui-polish.js','ui-v31-fixes.js','ui-season-nav.js','ui-canonical-time-window.js','ui-final-third-entries-gold.js','ui-penalty-area-entries-gold.js','ui-sequence-metrics.js','ui-technical-report.js'];(async()=>{for(let i=0;i<scripts.length;i++)await js(scripts[i],i)})().catch(console.error);
});
</script></body></html>
