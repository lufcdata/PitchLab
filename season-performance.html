<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PitchLab — Season Performance</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0d0e19;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="pitchlab-season" src="base.html?v=metrics-134" title="PitchLab Season Performance"></iframe>
<script>
const frame=document.getElementById('pitchlab-season');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;if(!doc)return;
  const addCss=(href,key)=>{const el=doc.createElement('link');el.rel='stylesheet';el.href=href;el.dataset[key]='1';doc.head.appendChild(el)};
  const addJs=(src,key)=>new Promise((resolve,reject)=>{const el=doc.createElement('script');el.src=src;el.async=false;el.dataset[key]='1';el.onload=resolve;el.onerror=reject;doc.body.appendChild(el)});
  const V='metrics-134';
  ['ui-integration.css','ui-arrow-style.css','ui-period.css','ui-team-colours.css','ui-polish.css','ui-v31-fixes.css','ui-heatmap.css','ui-season-performance.css','ui-season-multi-metrics.css','ui-season-metric-leaders.css','ui-season-event-marker-symbols.css'].forEach((s,i)=>addCss(`${s}?v=${V}`,`spc${i}`));
  const scripts=['ui-carry-metrics.js','ui-extra-metrics.js','ui-golden-metrics-v2.js','ui-possession-golden.js','ui-period.js','ui-touch-metrics-fix.js','ui-passing-metrics-golden.js','ui-metric-bible-sync.js','ui-gold-passing-family.js','ui-forward-pass-definition.js','ui-long-pass-definition.js','ui-through-ball-definition.js','ui-progressive-pass-definition.js','ui-penalty-box-pass-definition.js','ui-penalty-area-entries-gold.js','ui-gold-simple-event-family.js','ui-open-play-cross-definition.js','ui-throw-in-touch-territory-definition.js','ui-takeon-corner-definition.js','ui-corner-delivery-definition.js','ui-goal-family-definition.js','ui-defensive-residual-definition.js','ui-free-kick-definition.js','ui-gold-recovery-duels-family.js','ui-gold-attacking-family.js','ui-final-third-entries-gold.js','ui-action-outcome-definition.js','ui-pitch-event-rendering-fix.js','ui-combined-outcome-surfaces.js','ui-small-action-touch-dots.js','ui-season-event-marker-symbols.js','ui-team-metric-bible.js','ui-canonical-time-window.js','ui-pitch-time-window.js','ui-carry-canonical-window.js','ui-team-colours.js','ui-polish.js','ui-v31-fixes.js','ui-time-label-sync.js','ui-heatmap.js','ui-actions-map.js','ui-season-nav.js','ui-season-performance.js','ui-season-multi-metrics.js','ui-season-metric-leaders.js','ui-season-export-canvas.js','ui-season-validation.js','ui-season-competition-filter.js','ui-season-action-breakdown.js'];
  (async()=>{for(let i=0;i<scripts.length;i++)await addJs(`${scripts[i]}?v=${V}`,`spj${i}`)})().catch(err=>console.error('[PitchLab Season]',err));
});
</script>
</body>
</html>
