<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PitchLab UI Integration Preview</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0d0e19;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="pitchlab" src="index.html?v=leaders-ref-1" title="PitchLab UI Integration Preview"></iframe>
<script>
const frame=document.getElementById('pitchlab');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc)return;
  const addCss=(href,key)=>{if(doc.querySelector(`link[data-${key}]`))return;const el=doc.createElement('link');el.rel='stylesheet';el.href=href;el.dataset[key]='1';doc.head.appendChild(el)};
  const addJs=(src,key)=>{if(doc.querySelector(`script[data-${key}]`))return;const el=doc.createElement('script');el.src=src;el.dataset[key]='1';doc.body.appendChild(el)};
  addCss('ui-integration.css?v=leaders-ref-1','uiIntegration');
  addCss('ui-leaders.css?v=leaders-ref-1','uiLeaders');
  addCss('ui-timings.css?v=leaders-ref-1','uiTimings');
  addJs('ui-header.js?v=leaders-ref-1','uiIntegration');
  addJs('ui-leaders.js?v=leaders-ref-1','uiLeaders');
  addJs('ui-timings.js?v=leaders-ref-1','uiTimings');
});
</script>
</body>
</html>
