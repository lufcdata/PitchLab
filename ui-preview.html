<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PitchLab UI Integration Preview</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0d0e19;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="pitchlab" src="index.html?v=metrics-23" title="PitchLab UI Integration Preview"></iframe>
<script>
const frame=document.getElementById('pitchlab');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc)return;
  const addCss=(href,key)=>{if(doc.querySelector(`link[data-${key}]`))return;const el=doc.createElement('link');el.rel='stylesheet';el.href=href;el.dataset[key]='1';doc.head.appendChild(el)};
  const addJs=(src,key)=>{if(doc.querySelector(`script[data-${key}]`))return;const el=doc.createElement('script');el.src=src;el.dataset[key]='1';doc.body.appendChild(el)};
  addCss('ui-integration.css?v=metrics-23','uiIntegration');
  addCss('ui-leaders.css?v=metrics-23','uiLeaders');
  addCss('ui-timings.css?v=metrics-23','uiTimings');
  addCss('ui-arrow-style.css?v=metrics-23','uiArrowStyle');
  addCss('ui-period.css?v=metrics-23','uiPeriod');
  addCss('ui-match-stats.css?v=metrics-23','uiMatchStats');
  addCss('ui-pass-combinations.css?v=metrics-23','uiPassCombinations');
  addCss('ui-positions.css?v=metrics-23','uiPositions');
  addCss('ui-team-colours.css?v=metrics-23','uiTeamColours');
  addCss('ui-polish.css?v=metrics-23','uiPolish');
  addJs('ui-header.js?v=metrics-23','uiIntegration');
  addJs('ui-carry-metrics.js?v=metrics-23','uiCarryMetrics');
  addJs('ui-leaders.js?v=metrics-23','uiLeaders');
  addJs('ui-timings.js?v=metrics-23','uiTimings');
  addJs('ui-extra-metrics.js?v=metrics-23','uiExtraMetrics');
  addJs('ui-period.js?v=metrics-23','uiPeriod');
  addJs('ui-match-stats.js?v=metrics-23','uiMatchStats');
  addJs('ui-pass-combinations.js?v=metrics-23','uiPassCombinations');
  addJs('ui-positions.js?v=metrics-23','uiPositions');
  addJs('ui-team-colours.js?v=metrics-23','uiTeamColours');
  addJs('ui-polish.js?v=metrics-23','uiPolish');
});
</script>
</body>
</html>
