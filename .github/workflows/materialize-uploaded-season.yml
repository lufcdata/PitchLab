name: Materialize Uploaded Season Performance
on:
  push:
    branches: [season-performance-v1]
    paths:
      - '.github/workflows/materialize-uploaded-season.yml'
      - 'data/season/2026-27/WS_*_raw.json'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season-performance-v1
      - name: Build verified deterministic season packs
        run: |
          set -euo pipefail
          python scripts/season_ingest.py data/season/2026-27/WS_1983552_raw.json --season 2026-27
          python scripts/season_ingest.py data/season/2026-27/WS_1983559_raw.json --season 2026-27
          python scripts/season_ingest.py data/season/2026-27/WS_1983572_raw.json --season 2026-27
          python - <<'PY'
          import gzip,json,pathlib
          expected={1983552:1419,1983559:1542,1983572:1442}
          for mid,count in expected.items():
              p=pathlib.Path(f'data/season/2026-27/{mid}.json.gz')
              d=json.loads(gzip.decompress(p.read_bytes()))
              assert d['matchId']==mid
              assert d['club']['teamId']==19
              assert len(d['events'])==count
              print(mid, count, 'verified')
          PY
      - name: Commit verified packs and manifest
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/season/2026-27/1983552.json.gz data/season/2026-27/1983559.json.gz data/season/2026-27/1983572.json.gz data/season/2026-27/manifest.json
          if git diff --cached --quiet; then echo 'Verified packs already current'; exit 0; fi
          git commit -m 'Materialize verified Season Performance packs'
          git push origin HEAD:season-performance-v1
