name: Season Performance — Cloud Ingest

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch/ref containing the raw JSON staging file'
        required: true
        default: 'season-incoming'
        type: string
      raw_path:
        description: 'Path on source_ref (incoming/*.json or incoming/*.json.gz)'
        required: true
        type: string
      season:
        description: 'Season storage key'
        required: true
        default: '2026-27'
        type: string
      competition:
        description: 'Competition label'
        required: true
        default: 'Premier League'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: season-ingest-${{ inputs.season }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production foundation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read staged raw JSON without adding it to main
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RAW_PATH: ${{ inputs.raw_path }}
        run: |
          set -euo pipefail
          case "$RAW_PATH" in
            incoming/*.json|incoming/*.json.gz) ;;
            *) echo "::error::raw_path must be incoming/*.json or incoming/*.json.gz"; exit 1 ;;
          esac
          test -n "$SOURCE_REF" || { echo "::error::source_ref is required"; exit 1; }
          git fetch --no-tags origin "$SOURCE_REF"
          mkdir -p .season-source
          LOCAL_SOURCE=".season-source/$(basename "$RAW_PATH")"
          git show "FETCH_HEAD:$RAW_PATH" > "$LOCAL_SOURCE" || { echo "::error::Raw JSON not found on source_ref"; exit 1; }
          python3 - <<'PY'
          import gzip,json,os,pathlib
          p=pathlib.Path(os.environ['LOCAL_SOURCE'])
          raw=gzip.decompress(p.read_bytes()) if p.name.endswith('.gz') else p.read_bytes()
          json.loads(raw.decode('utf-8'))
          print('Raw season source JSON validated')
          PY
          echo "path=$LOCAL_SOURCE" >> "$GITHUB_OUTPUT"

      - name: Ingest and compress fixture
        run: python3 scripts/season_ingest.py "${{ steps.source.outputs.path }}" --season "${{ inputs.season }}" --competition "${{ inputs.competition }}"

      - name: Verify generated season data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool "data/season/${{ inputs.season }}/manifest.json" >/dev/null
          python3 - <<'PY'
          import gzip,json,pathlib
          root=pathlib.Path('data/season/${{ inputs.season }}')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['matches'], 'manifest contains no matches'
          for m in manifest['matches']:
              p=pathlib.Path(m['pack'])
              if p.exists():
                  data=json.loads(gzip.decompress(p.read_bytes()))
                  assert data.get('events'), f'{p} contains no events'
                  assert str(data.get('matchId')) == str(m.get('matchId')), f'{p} matchId mismatch'
          print(f"Validated {len(manifest['matches'])} manifest fixtures")
          PY

      - name: Create ingest branch
        id: branch
        shell: bash
        env:
          LOCAL_SOURCE: ${{ steps.source.outputs.path }}
        run: |
          set -euo pipefail
          MATCH_ID=$(python3 - <<'PY'
          import gzip,json,re,os,pathlib
          p=pathlib.Path(os.environ['LOCAL_SOURCE'])
          raw=gzip.decompress(p.read_bytes()) if p.name.endswith('.gz') else p.read_bytes()
          d=json.loads(raw.decode('utf-8'))
          m=re.search(r'(\d{6,})',p.name)
          value=d.get('matchId') or d.get('id') or (m.group(1) if m else None)
          if not value: raise SystemExit('Could not determine match ID')
          print(value)
          PY
          )
          BRANCH="season-ingest-${MATCH_ID}-${GITHUB_RUN_ID}"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "data/season/${{ inputs.season }}"
          git commit -m "Ingest season fixture ${MATCH_ID}"
          git push origin "$BRANCH"

      - name: Open review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "${{ steps.branch.outputs.name }}" --title "Ingest Season Performance fixture" --body $'Cloud-generated Season Performance ingest.\n\nChecks performed:\n- raw JSON read from an isolated staging ref\n- raw source is not added to main or the generated PR\n- Leeds fixture identity/home-away membership validated\n- immutable gzip match pack generated\n- manifest upserted\n- pack decompression/event/match-ID validation passed\n\nReview and merge through the normal Golden Workflow.'
