name: Apply Carry V6 Once
on: push
permissions:
  contents: write
jobs:
  promote:
    if: contains(github.event.head_commit.message, 'Simplify one-time Carry V6 promotion workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: carry-brighton-v6-audit
      - run: python scripts/promote-carry-v6-once.py
      - run: rm scripts/promote-carry-v6-once.py .github/workflows/apply-carry-v6-once.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply audited Carry Engine V6 candidate"
          git push origin HEAD:carry-brighton-v6-audit
